[package]
name = "voting-example"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "voting"
path = "src/main.rs"

[dependencies]
# The kit (local path — switch to crates.io version once published)
solana-askama-kit = { path = "../.." }

# Solana / Anchor — must match your workspace versions exactly
anchor-client = { version = "1.0.2", features = ["async"] }
anchor-lang = "1.0.2"
solana-sdk = "4.0.1"

# Web
axum = "0.8.9"
askama = "0.16.0"

# Async / misc
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
chrono = "0.4"
